<!DOCTYPE html>
<html lang="en" class="light" style="scroll-behavior: smooth;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI Prompt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Playfair Display', 'Georgia', 'serif'],
          },
          colors: {
            brand: { 50:'#f5f3ff',100:'#ede9fe',600:'#7c3aed',700:'#6d28d9' }
          },
          animation: {
            'float-slow': 'float 22s ease-in-out infinite',
            'float-medium': 'float 16s ease-in-out infinite reverse',
            'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) both',
            'scale-in': 'scaleIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards',
          },
          keyframes: {
            float: {
              '0%':{transform:'translate(0px,0px) scale(1)'},
              '33%':{transform:'translate(18px,-22px) scale(1.04)'},
              '66%':{transform:'translate(-12px,12px) scale(0.96)'},
              '100%':{transform:'translate(0px,0px) scale(1)'}
            },
            fadeInUp:{ '0%':{opacity:'0',transform:'translateY(20px)'}, '100%':{opacity:'1',transform:'translateY(0)'} },
            scaleIn:{ '0%':{opacity:'0',transform:'scale(0.95)'}, '100%':{opacity:'1',transform:'scale(1)'} },
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    html { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
      margin: 0;
      padding-top: 1rem;
      padding-bottom: env(safe-area-inset-bottom);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.no-scroll {
      overflow: hidden !important;
      touch-action: none;
    }

    #main-content {
      flex: 1 0 auto;
      width: 100%;
    }
    footer {
      flex-shrink: 0;
      margin-top: auto;
      width: 100%;
    }

    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(30px) scale(0.98);
      will-change: transform, opacity;
      transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1),
                  transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }
    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    a, button, input, select, textarea, .cat-tab {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    button:active, .cat-tab:active { transform: scale(0.95)!important; }

    .hover-lift {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s;
    }
    .hover-lift:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 20px 35px -10px rgba(30, 41, 59, 0.12);
    }

    .prompt-card-wrap {
      aspect-ratio: 1 / 0.95;
      background: #fff;
      border-radius: 1.25rem;
      overflow: hidden;
      border: 1px solid #f1f5f9;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.03);
      width: 100%;
      position: relative;
    }
    .prompt-card-wrap:hover {
      transform: translateY(-6px) scale(1.015);
      box-shadow: 0 20px 40px -12px rgba(30, 41, 59, 0.18);
      border-color: #1e293b;
    }
    .prompt-card-img {
      width: 100%;
      height: 62%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }
    .prompt-card-wrap:hover .prompt-card-img { transform: scale(1.06); }
    .prompt-card-body {
      padding: 0.75rem;
      height: 38%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    @keyframes overlayOpen {
      0% { opacity: 0; transform: scale(0.97); filter: blur(10px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0px); }
    }
    @keyframes overlayClose {
      0% { opacity: 1; transform: scale(1); filter: blur(0px); }
      100% { opacity: 0; transform: scale(0.97); filter: blur(10px); }
    }

    #overlay-container {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
    }
    #overlay-container > * {
      pointer-events: auto;
    }

    .full-page-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      opacity: 1;
      animation: overlayOpen 0.35s cubic-bezier(0.16,1,0.3,1) forwards;
      overscroll-behavior: contain;
    }
    .full-page-overlay.closing { animation: overlayClose 0.3s cubic-bezier(0.16,1,0.3,1) forwards!important; }

    .back-btn {
      padding: 6px 10px;
      background: transparent;
      color: #1e293b;
      border: none;
      cursor: pointer;
      border-radius: 9999px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .back-btn:hover { background: #f1f5f9; transform: scale(1.05); }

    .cat-tab {
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      background: #f1f5f9;
      color: #475569;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cat-tab:hover { background: #e2e8f0; color: #1e293b; }
    .cat-tab.active {
      background: #1e293b;
      color: white;
      border-color: #1e293b;
      box-shadow: 0 4px 14px rgba(30, 41, 59, 0.25);
    }

    .no-scrollbar::-webkit-scrollbar{display:none} .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}

    #loaderOverlay {
      position:fixed; inset:0; z-index:99999; background:#ffffff; display:flex; flex-direction:column; align-items:center; justify-content:center;
      transition: opacity 0.6s cubic-bezier(0.16,1,0.3,1), visibility 0.6s;
    }
    #loaderOverlay.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .loader-logo { font-size:2.5rem; font-weight:800; margin-bottom:2rem; }
    .loading-bar-track { width:240px; height:5px; background:#e5e7eb; border-radius:4px; overflow:hidden; }
    .loading-bar-fill {
      height:100%; width:0%; border-radius:4px;
      background:linear-gradient(90deg,#7c3aed,#8b5cf6,#a78bfa,#8b5cf6,#7c3aed);
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gradient-text { background:linear-gradient(135deg,#7c3aed,#8b5cf6,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

    .img-protect-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 62%;
      pointer-events: none;
      z-index: 2;
    }

    #prompts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.875rem;
    }
    @media (min-width: 640px) {
      #prompts-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.25rem; }
    }
    @media (min-width: 768px) {
      #prompts-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    }
    @media (min-width: 1024px) {
      #prompts-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }
    @media (min-width: 1280px) {
      #prompts-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    }

    .hero-banner {
      height: 40vh;
      min-height: 200px;
      max-height: 500px;
    }
    @media (min-width: 640px) {
      .hero-banner { height: 45vh; max-height: 550px; }
    }
    @media (min-width: 1024px) {
      .hero-banner { height: 50vh; max-height: 600px; }
    }

    .detail-copy-area {
      padding: 1rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
      background: #ffffff;
      flex-shrink: 0;
      width: 100%;
      z-index: 10;
    }

    .fluid-heading {
      font-size: clamp(1.5rem, 5vw, 3.5rem);
    }
    .fluid-sub {
      font-size: clamp(0.75rem, 1.2vw, 1rem);
    }

    /* ---- Suggestion scroll container ---- */
    .suggestion-scroll-wrap {
      width: 100%;
      overflow: hidden;
      position: relative;
      border-radius: 0.75rem;
      background: #ffffff;
      padding: 0.25rem 0;
    }
    .suggestion-scroll-container {
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      gap: 0.75rem;
      padding: 0.25rem 0.125rem;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-x;
    }
    .suggestion-scroll-container::-webkit-scrollbar {
      display: none;
    }
    .suggestion-scroll-container:active {
      cursor: grabbing;
    }

    .suggestion-card {
      flex: 0 0 auto;
      width: 160px;
      background: #f8fafc;
      border-radius: 1rem;
      padding: 0.6rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      text-align: center;
    }
    .suggestion-card:hover {
      background: #f1f5f9;
      transform: scale(1.03);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .suggestion-card:active {
      transform: scale(0.95);
    }
    .suggestion-card img {
      width: 100%;
      aspect-ratio: 1.2 / 1;
      object-fit: cover;
      border-radius: 0.6rem;
      margin-bottom: 0.4rem;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .suggestion-card h4 {
      font-size: 0.7rem;
      font-weight: 700;
      color: #1e293b;
      line-clamp: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (min-width: 480px) {
      .suggestion-card { width: 190px; padding: 0.7rem; }
      .suggestion-card h4 { font-size: 0.8rem; }
    }
    @media (min-width: 640px) {
      .suggestion-card { width: 220px; padding: 0.8rem; }
      .suggestion-card h4 { font-size: 0.85rem; }
    }
    @media (min-width: 768px) {
      .suggestion-card { width: 250px; padding: 0.9rem; }
      .suggestion-card h4 { font-size: 0.9rem; }
    }

    /* Override for pure white page */
    .bg-white-pure { background: #ffffff; }
  </style>
</head>
<body class="no-scroll bg-white-pure">

  <div id="loaderOverlay">
    <div class="loader-logo gradient-text">AI PROMPT</div>
    <div class="loading-bar-track"><div id="loading-bar-fill" class="loading-bar-fill" style="width:0%"></div></div>
  </div>

  <main id="main-content" class="w-full px-3 sm:px-6 md:px-8 lg:px-10 pb-12 bg-white-pure">

    <section class="relative w-full rounded-2xl sm:rounded-3xl hero-banner overflow-hidden shadow-xl ring-1 ring-black/5 isolate reveal-on-scroll">
      <div class="absolute inset-0 bg-[#f5f3ff] overflow-hidden">
        <div class="absolute top-[-15%] right-[-10%] w-[350px] sm:w-[700px] h-[350px] sm:h-[700px] rounded-full bg-gradient-to-b from-purple-300 via-indigo-300 to-transparent blur-[120px] opacity-60 animate-float-slow mix-blend-multiply"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[300px] sm:w-[550px] h-[300px] sm:h-[550px] rounded-full bg-gradient-to-tr from-violet-400 via-fuchsia-200 to-blue-200 blur-[100px] opacity-50 animate-float-medium mix-blend-multiply"></div>
      </div>
      <div class="absolute inset-0 flex items-center justify-center text-center px-4 backdrop-blur-[2px]">

          <h1 class="fluid-heading font-extrabold text-gray-900 tracking-tight mb-5 leading-tight">

          <a href="#prompts" class="relative z-20 inline-flex items-center gap-2.5 bg-white text-gray-900 pl-7 pr-5 py-3.5 rounded-full shadow-xl hover:scale-105 hover:shadow-2xl transition-all active:scale-95 border border-purple-100 cursor-pointer select-none">
            <span class="fluid-sub font-extrabold tracking-tight pointer-events-none">LET'S GO</span>

    <section id="prompts" class="mt-8 sm:mt-12 reveal-on-scroll">

      <div class="space-y-3.5 mb-6">

          <input type="text" id="prompt-search" placeholder="Search Prompts..." class="w-full px-5 py-3.5 pr-12 border border-gray-200/80 bg-white rounded-2xl text-sm outline-none shadow-sm focus:ring-2 focus:ring-slate-900/10 focus:border-slate-800 transition-all">
          <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-search"></i></span>
        </div>
        <div class="w-full">
          <div class="flex flex-nowrap gap-2 overflow-x-auto no-scrollbar pb-1 w-full" id="ai-model-tabs"></div>
        </div>
        <div class="w-full">
          <div class="flex flex-nowrap gap-2 overflow-x-auto no-scrollbar pb-1 w-full" id="category-tabs"></div>

      </div>

      <div id="prompts-grid"></div>

      <div id="empty-state" class="hidden text-center py-16">
        <div class="text-4xl mb-3 text-gray-300"><i class="fas fa-folder-open"></i></div>

        <p class="text-sm text-gray-400 mt-1">Try searching for a different title or select another category</p>
      </div>

  </main>

  <footer class="w-full px-3 sm:px-6 md:px-8 lg:px-10 mb-6 reveal-on-scroll">
    <div class="w-full bg-[#0A0A0B] rounded-2xl sm:rounded-3xl text-white px-6 sm:px-10 py-8 sm:py-10 text-center shadow-2xl">
      <div class="flex flex-col items-center gap-3">

  <div id="overlay-container"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, doc, query, orderBy, where, onSnapshot, getDocs, startAfter, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBx1l10Zqh8mRDzCLcjKxKdBcIdEBg2oes",
      authDomain: "aixprompts.firebaseapp.com",
      projectId: "aixprompts",
      storageBucket: "aixprompts.firebasestorage.app",
      messagingSenderId: "101375435918",
      appId: "1:101375435918:web:021e7a74a7c76d245495df",
      measurementId: "G-V6YJZHQS97"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);
    const promptsGrid = $('#prompts-grid');
    const emptyState = $('#empty-state');
    const categoryTabs = $('#category-tabs');
    const aiModelTabs = $('#ai-model-tabs');
    const searchInput = $('#prompt-search');
    const loaderOverlay = $('#loaderOverlay');
    const loadingBarFill = $('#loading-bar-fill');
    const overlayContainer = $('#overlay-container');

    let allPrompts = [];
    let filteredPrompts = [];
    let categories = [];
    let aiModelsList = [];
    let activeCategory = 'all';
    let activeAI = 'all';
    let searchQuery = '';

    let loadProgress = {
      categories: false,
      aiModels: false,
      prompts: false,
    };
    const totalSteps = 3;

    function updateLoaderProgress() {
      const completed = Object.values(loadProgress).filter(Boolean).length;
      const percent = Math.round((completed / totalSteps) * 100);
      loadingBarFill.style.width = percent + '%';
    }

    function hideLoader() {
      if (!loaderOverlay.classList.contains('hidden')) {
        loaderOverlay.classList.add('hidden');
        setTimeout(() => {
          loaderOverlay.style.display = 'none';
          unlockScroll();
        }, 600);
      }
    }

    function escHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function lockScroll() {
      document.body.classList.add('no-scroll');
    }

    function unlockScroll() {
      if (!overlayContainer.children.length && loaderOverlay.classList.contains('hidden')) {
        document.body.classList.remove('no-scroll');
      }
    }

    function getCategoryLabel(id) {
      const c = categories.find(c => c.id === id);
      return c ? c.name : id;
    }

    function getAIBadge(ai) {
      const map = {
        'GPT-4': 'bg-blue-50 text-blue-700', 'GPT-4o': 'bg-indigo-50 text-indigo-700',
        'Claude 3': 'bg-amber-50 text-amber-700', 'Claude 3.5': 'bg-orange-50 text-orange-700',
        'Gemini': 'bg-emerald-50 text-emerald-700', 'Midjourney': 'bg-purple-50 text-purple-700',
        'Llama': 'bg-rose-50 text-rose-700', 'DALL-E': 'bg-cyan-50 text-cyan-700'
      };
      return map[ai] || 'bg-gray-50 text-gray-700';
    }

    const PLACEHOLDER_SVG = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22%3E%3Crect fill=%22%23f3f0ff%22 width=%22400%22 height=%22300%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23a78bfa%22 font-size=%2220%22%3ENo Image%3C/text%3E%3C/svg%3E';

    function observeReveal() {
      const els = document.querySelectorAll('.reveal-on-scroll');
      if (window._revealObserver) window._revealObserver.disconnect();
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
          } else {
            entry.target.classList.remove('is-visible');
          }
        });
      }, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });
      els.forEach(el => observer.observe(el));
      window._revealObserver = observer;
      setTimeout(() => {
        els.forEach(el => {
          const rect = el.getBoundingClientRect();
          if (rect.top < window.innerHeight && rect.bottom > 0) {
            el.classList.add('is-visible');
          }
        });
      }, 50);
    }

    function renderPrompts() {
      filteredPrompts = allPrompts.filter(p => {
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q || (p.title || '').toLowerCase().includes(q);
        const matchesCategory = activeCategory === 'all' || p.category === activeCategory;
        const matchesAI = activeAI === 'all' || p.ai === activeAI;
        return matchesSearch && matchesCategory && matchesAI;
      });

      if (filteredPrompts.length === 0) {
        promptsGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      const html = filteredPrompts.map(p => {
        const img = p.image || PLACEHOLDER_SVG;
        const safeTitle = escHTML(p.title || 'Untitled');
        const safeCat = escHTML(getCategoryLabel(p.category));
        const safeAI = escHTML(p.ai || 'AI');
        return `
          <div class="prompt-card-wrap hover-lift reveal-on-scroll" onclick="window.openPromptDetail('${p.id}')" style="position:relative;">
            <img src="${img}" class="prompt-card-img" loading="lazy" onerror="this.onerror=null;this.src='${PLACEHOLDER_SVG}';" draggable="false">
            <div class="img-protect-overlay"></div>
            <div class="prompt-card-body">
              <h3 class="text-xs sm:text-sm font-bold text-gray-900 line-clamp-1 w-full text-center mb-1.5">${safeTitle}</h3>
              <div class="flex items-center justify-center gap-1.5 flex-wrap">
                <span class="text-[9px] bg-gray-100 px-2 py-0.5 rounded-full text-gray-600 font-medium">${safeCat}</span>
                <span class="text-[9px] px-2 py-0.5 rounded-full ${getAIBadge(p.ai)} font-medium">${safeAI}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      promptsGrid.innerHTML = html;
      setTimeout(observeReveal, 50);
      applyProtectionToImages();
    }

    function renderAITabs() {
      const dbAiNames = aiModelsList.map(m => m.name || m.title || m.id);
      const promptAiNames = allPrompts.map(p => p.ai).filter(Boolean);
      const uniqueAIs = Array.from(new Set([...dbAiNames, ...promptAiNames]));

      aiModelTabs.innerHTML = `<span class="cat-tab ${activeAI === 'all' ? 'active' : ''}" data-ai="all">All Models</span>` +
        uniqueAIs.map(m => `
          <span class="cat-tab ${m === activeAI ? 'active' : ''}" data-ai="${escHTML(m)}">
            ${escHTML(m)}
          </span>
        `).join('');

      $$('#ai-model-tabs .cat-tab').forEach(tab => {
        tab.onclick = () => {
          $$('#ai-model-tabs .cat-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          activeAI = tab.dataset.ai;
          renderPrompts();
        };
      });
    }

    function renderCategoryTabs() {
      categoryTabs.innerHTML = `<span class="cat-tab ${activeCategory === 'all' ? 'active' : ''}" data-cat="all">All Categories</span>` +
        categories.map(c => `<span class="cat-tab ${c.id === activeCategory ? 'active' : ''}" data-cat="${c.id}">${escHTML(c.name)}</span>`).join('');

      $$('#category-tabs .cat-tab').forEach(tab => {
        tab.onclick = () => {
          $$('#category-tabs .cat-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          activeCategory = tab.dataset.cat;
          renderPrompts();
        };
      });
    }

    function setupDataListeners() {
      onSnapshot(collection(db, 'categories'), (snap) => {
        categories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderCategoryTabs();
        if (!loadProgress.categories) {
          loadProgress.categories = true;
          updateLoaderProgress();
        }
      }, (err) => {
        console.error('Categories error:', err);
        loadProgress.categories = true;
        updateLoaderProgress();
      });

      onSnapshot(collection(db, 'aimodels'), (snap) => {
        aiModelsList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAITabs();
        if (!loadProgress.aiModels) {
          loadProgress.aiModels = true;
          updateLoaderProgress();
        }
      }, (err) => {
        console.error('AI models error:', err);
        loadProgress.aiModels = true;
        updateLoaderProgress();
      });

      const q = query(
        collection(db, 'prompts'),
        where('status', '==', 'published'),
        orderBy('createdAt', 'desc')
      );
      onSnapshot(q, (snap) => {
        allPrompts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderPrompts();
        if (!loadProgress.prompts) {
          loadProgress.prompts = true;
          updateLoaderProgress();
          if (loadProgress.categories && loadProgress.aiModels && loadProgress.prompts) {
            setTimeout(hideLoader, 300);
          }
        }
      }, (err) => {
        console.error('Prompts error:', err);
        emptyState.innerHTML = `
          <div class="text-4xl mb-3 text-gray-300"><i class="fas fa-exclamation-circle"></i></div>
          <h3 class="text-base font-semibold text-gray-700">Unable to load prompts</h3>
          <p class="text-sm text-gray-400 mt-1">Please check your connection or try again later.</p>`;
        emptyState.classList.remove('hidden');
        loadProgress.prompts = true;
        updateLoaderProgress();
        if (loadProgress.categories && loadProgress.aiModels && loadProgress.prompts) {
          setTimeout(hideLoader, 300);
        }
      });
    }

    // --- Suggestion auto-scroll (right to left, infinite loop) ---
    function initSuggestionScroll(container) {
      if (!container) return;
      let paused = false;
      let animationId = null;
      const speed = 0.6; // pixels per frame

      function step() {
        if (!paused && container) {
          const maxScroll = container.scrollWidth - container.clientWidth;
          if (maxScroll <= 0) {
            animationId = requestAnimationFrame(step);
            return;
          }
          container.scrollLeft += speed;
          if (container.scrollLeft >= maxScroll - 1) {
            container.scrollLeft = 0;
          }
        }
        animationId = requestAnimationFrame(step);
      }

      function pause() { paused = true; }
      function resume() { paused = false; }

      container.addEventListener('mouseenter', pause, { passive: true });
      container.addEventListener('mouseleave', resume, { passive: true });
      container.addEventListener('touchstart', pause, { passive: true });
      container.addEventListener('touchend', () => { setTimeout(resume, 150); }, { passive: true });

      step();
      return () => { if (animationId) cancelAnimationFrame(animationId); };
    }

    // --- Overlay & Copy ---
    function openFullOverlay(html) {
      if (overlayContainer.children.length) {
        const existing = overlayContainer.querySelector('.full-page-overlay');
        if (existing) {
          existing.classList.add('closing');
          setTimeout(() => {
            overlayContainer.innerHTML = '';
            unlockScroll();
          }, 280);
          setTimeout(() => {
            overlayContainer.innerHTML = html;
            lockScroll();
            setTimeout(() => {
              const scrollContainer = document.querySelector('.suggestion-scroll-container');
              if (scrollContainer) initSuggestionScroll(scrollContainer);
            }, 50);
          }, 300);
          return;
        }
      }
      overlayContainer.innerHTML = html;
      lockScroll();
      setTimeout(() => {
        const scrollContainer = document.querySelector('.suggestion-scroll-container');
        if (scrollContainer) initSuggestionScroll(scrollContainer);
      }, 50);
    }

    function closeFullOverlay() {
      const activeOverlay = overlayContainer.querySelector('.full-page-overlay');
      if (activeOverlay) {
        activeOverlay.classList.add('closing');
        setTimeout(() => {
          overlayContainer.innerHTML = '';
          unlockScroll();
        }, 280);
      } else {
        overlayContainer.innerHTML = '';
        unlockScroll();
      }
    }

    window.openPromptDetail = function(id) {
      const p = allPrompts.find(p => p.id === id);
      if (!p) return;
      const safeTitle = escHTML(p.title);
      const safeCreator = escHTML(p.creatorName || 'Unknown');
      const safeCat = escHTML(getCategoryLabel(p.category));
      const safeAI = escHTML(p.ai);

      const suggested = allPrompts.filter(item => {
        return item.id !== p.id && (item.category === p.category || item.ai === p.ai);
      }).slice(0, 10);

      let suggestionsHtml = '';
      if (suggested.length > 0) {
        const itemsHtml = suggested.map(sp => {
          const spTitle = escHTML(sp.title || 'Untitled');
          const spImg = sp.image || PLACEHOLDER_SVG;
          return `
            <div class="suggestion-card" onclick="window.openPromptDetail('${sp.id}')">
              <img src="${spImg}" onerror="this.onerror=null;this.src='${PLACEHOLDER_SVG}';" draggable="false" loading="lazy">
              <h4>${spTitle}</h4>
            </div>
          `;
        }).join('');

        // Duplicate items for seamless infinite scroll (3 sets)
        const triple = itemsHtml + itemsHtml + itemsHtml;

        suggestionsHtml = `
          <div class="w-full text-left py-1">
            <div class="suggestion-scroll-wrap">
              <div class="suggestion-scroll-container">
                ${triple}
              </div>
            </div>
          </div>
        `;
      }

      const html = `
        <div class="full-page-overlay" id="detail-overlay">
          <div class="flex flex-col h-full w-full bg-white-pure relative overflow-hidden">
            <div class="flex items-center px-4 py-3 border-b border-gray-100 shadow-xs shrink-0 gap-3 z-10 bg-white-pure">
              <button class="back-btn" onclick="window.closeFullOverlay()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <h2 class="text-base sm:text-lg font-extrabold text-gray-900">Prompt Details</h2>
            </div>
            <div class="flex-1 overflow-y-auto w-full px-4 sm:px-6 py-4 flex flex-col items-center text-center space-y-3 max-w-3xl mx-auto bg-white-pure">
              <div class="w-full max-w-xs mx-auto flex justify-center shrink-0">
                <img src="${p.image || PLACEHOLDER_SVG}" class="w-full max-h-[30vh] sm:max-h-[35vh] object-contain rounded-2xl shadow-md border border-gray-100" onerror="this.onerror=null;this.src='${PLACEHOLDER_SVG}';" draggable="false">
              </div>
              <h1 class="text-lg sm:text-xl font-extrabold text-gray-900 leading-tight">${safeTitle}</h1>
              <p class="text-xs text-gray-500 font-medium">Created by <span class="text-gray-800 font-semibold">${safeCreator}</span></p>
              <div class="flex items-center justify-center gap-2 flex-wrap">
                <span class="text-xs px-3 py-0.5 rounded-full bg-gray-100 text-gray-700 font-medium border border-gray-200">${safeCat}</span>
                <span class="text-xs px-3 py-0.5 rounded-full ${getAIBadge(p.ai)} font-medium">${safeAI}</span>
              </div>
              ${suggestionsHtml}
              <div class="h-4 sm:h-6"></div>
            </div>
            <div class="detail-copy-area shrink-0 flex justify-center w-full bg-white-pure">
              <button id="copy-btn-${p.id}" onclick="window.copyPromptById('${p.id}')" class="w-full max-w-md py-3 bg-slate-900 text-white rounded-2xl font-bold text-sm sm:text-base hover:bg-slate-800 transition-all active:scale-95 cursor-pointer flex items-center justify-center gap-2 shadow-md">
                <i class="fas fa-copy text-base"></i> <span id="copy-btn-text">Copy Prompt</span>
              </button>
            </div>
          </div>
        </div>`;
      openFullOverlay(html);
      setTimeout(() => applyProtectionToImages(), 100);
    };

    window.copyPromptById = function(id) {
      const p = allPrompts.find(p => p.id === id);
      if (!p) return;
      const text = p.prompt || '';
      if (!text) return;
      const btnText = document.getElementById('copy-btn-text');
      const btn = document.getElementById(`copy-btn-${id}`);
      const handleSuccess = () => {
        if (btnText) btnText.textContent = 'Copied!';
        if (btn) btn.classList.add('scale-105', 'opacity-90');
        setTimeout(() => {
          if (btnText) btnText.textContent = 'Copy Prompt';
          if (btn) btn.classList.remove('scale-105', 'opacity-90');
        }, 1800);
      };
      navigator.clipboard.writeText(text).then(handleSuccess).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        handleSuccess();
      });
    };

    function applyProtectionToImages() {
      document.querySelectorAll('img').forEach(img => {
        img.setAttribute('draggable', 'false');
        img.addEventListener('contextmenu', (e) => e.preventDefault());
        img.addEventListener('dragstart', (e) => e.preventDefault());
      });
      document.addEventListener('contextmenu', (e) => {
        if (e.target.tagName === 'IMG' || e.target.closest('.prompt-card-wrap') || e.target.closest('.full-page-overlay')) {
          e.preventDefault();
        }
      });
      document.querySelectorAll('.prompt-card-wrap, .full-page-overlay img, .suggestion-card img').forEach(el => {
        el.addEventListener('dragstart', (e) => e.preventDefault());
        el.addEventListener('drop', (e) => e.preventDefault());
      });
    }

    let searchTimeout;
    searchInput.oninput = () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchQuery = searchInput.value;
        renderPrompts();
      }, 300);
    };

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && (e.key === 's' || e.key === 'u' || e.key === 'U' || e.key === 'S')) {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) {
        e.preventDefault();
      }
      if (e.key === 'F12') {
        e.preventDefault();
      }
    });

    function init() {
      lockScroll();
      setupDataListeners();
      observeReveal();
      applyProtectionToImages();
      setTimeout(() => {
        if (!loaderOverlay.classList.contains('hidden')) {
          hideLoader();
        }
      }, 8000);
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      init();
    } else {
      document.addEventListener('DOMContentLoaded', init);
    }

    window.openPromptDetail = openPromptDetail;
    window.copyPromptById = copyPromptById;
    window.closeFullOverlay = closeFullOverlay;
  </script>
</body>
</html>
